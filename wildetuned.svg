<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ece8df" />
      <stop offset="100%" stop-color="#d7cbb5" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f4" />
      <stop offset="100%" stop-color="#c6c6c8" />
    </linearGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#d1c2aa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#bg)" />

  <rect x="90" y="90" width="780" height="240" rx="32" fill="url(#metal)" stroke="#9e8f7a" stroke-width="3" filter="url(#shadow)" />
  <rect x="110" y="110" width="740" height="200" rx="24" fill="url(#plate)" stroke="#b8a691" stroke-width="2" />

  <g fill="none" stroke="#b3a293" stroke-width="2" opacity="0.9">
