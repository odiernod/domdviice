    <circle cx="795" cy="105" r="6" />
    <circle cx="120" cy="315" r="6" />
    <circle cx="140" cy="315" r="6" />
    <circle cx="775" cy="315" r="6" />
    <circle cx="795" cy="315" r="6" />
