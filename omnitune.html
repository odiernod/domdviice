<script>
// speed bump for iframe content thieves

if (top!=self) top.location.replace(document.location);

//display scale notes based on scale and key
function showScale(scale, key) {
    if (scaleMode) clearScale();
    scaleMode = true;
    var scaleNotes =[];
    var keyNotes = keys[key]; //get the ordered notes in the key
    var scaleDegrees = scales[scale]; //get the scale degrees for the selected scale
    var nashvilleNumbers =[];
    //build the scale for the key
    for (let i = 0; i < 12; i++) {
        if (scaleDegrees[i] == 1) {
            scaleNotes.push(keyNotes[i]);
            nashvilleNumbers.push(i+1);
        }
    }
    

    //skip root note, already highlighted red in the above for block
    for (let i = 0; i < scaleNotes.length; i++) {
        var scaleTones = tones[scaleNotes[i]];
        for (let j = 0; j < scaleTones.length; j++){
           if (showScaleDegrees) {highlightDegree(scaleTones[j], nashvilleNumbers[i]);}
           else {
            if (i == 0) highlightred(scaleTones[j]); //highlight root notes in red
            else highlight(scaleTones[j]);
           }
            
        }
    }
}

//clear all highlighting
function clearScale() {
    for (let i = 0; i < keys.g.length; i++) {
        var keyTones = tones[keys.g[i]];
        for (let j = 0; j < keyTones.length; j++){
            clearHighlight(keyTones[j]);
        }
    }
    scaleMode = false;
}

function clearNoteNames()
{
    for (let i = 0; i < keys.g.length; i++) {
        var keyTones = tones[keys.g[i]];
        for (let j = 0; j < keyTones.length; j++){
            clearNoteName(keyTones[j]);
        }
    }
}

function updateNoteNames()
{
    if (showNoteNames)
    {
        clearNoteNames();
        for (let i = 0; i < keys.g.length; i++) 
        {
            var keyTones = tones[keys.g[i]];
            for (let j = 0; j < keyTones.length; j++){
                showNoteName(keyTones[j]);
            }
        }
    }
}

function toggleNoteNames() {
    showNoteNames = !showNoteNames;
    $('#noteNames').html(showNoteNames?'Hide Note Names':
                              'Show Note Names')
    if (showNoteNames)
    {
        updateNoteNames();
    }
    else {
        clearNoteNames();
    }
}

function updateValvedVisibility(bankNum) {
    var type = $("#instrument" + bankNum + "Menu").val();
    if (isTenHoleHarmonica(type)) {
        $("#valved" + bankNum + "Container").show();
    } else {
        $("#valved" + bankNum + "Container").hide();
        $("#valved" + bankNum).prop('checked', false);
    }
}

// helper that ensures a canvas exists in the instrument image container and returns it
function ensureInstrumentCanvas(divId, width = 800, height = 200) {
    var $div = $("#" + divId);
    var canvas = $div.find('canvas')[0];
    if (!canvas) {
        canvas = document.createElement('canvas');
        $div.empty().append(canvas);
    }
    // always adjust size to match requested dimensions
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    canvas.style.width  = width + 'px';
    canvas.style.height = height + 'px';
    return canvas;
}

// schedule drawing of guitar fretboard behind the given table
function updateGuitarCanvas(divId, tableId) {
    requestAnimationFrame(function() {
        var $tbl = $("#" + tableId);
        if (!$tbl.length) {
            return;
        }
        var cols = $tbl.find('tr:first td').length;
        var rows = $tbl.find('tr').length;
        if (cols === 0 || rows === 0) {
            return;
        }
        // use outer dimensions for reliable sizing
        var tblW = $tbl.outerWidth();
        var tblH = $tbl.outerHeight();
        var cellW = tblW / cols;
        var labelMargin = 28;  // extra space at bottom for fret numbers
        var offsetX = cellW / 2; // shift right by half a cell
        var w = tblW + offsetX;
        var h = tblH + labelMargin;
        var c = ensureInstrumentCanvas(divId, w, h);
        // pass cellW only; draw function ignores cellH now
        drawGuitarFretboard(c, cols, rows, cellW, null, offsetX, labelMargin);
    });
}

// draw a simple guitar fretboard on the supplied canvas
// cols = number of note columns (frets + 1), rows = number of strings
// cellW/cellH = measured cell dimensions; offsetX shifts the drawing right
// labelMargin reserves space at the bottom for the fret numbers
function drawGuitarFretboard(canvas, cols = 24, rows = 6,
                              cellW = null, cellH = null,
                              offsetX = 0, labelMargin = 28) {
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;

    // compute spacing and base x position
    var spacingX = cellW || ((w - offsetX) / cols);
    var baseX = offsetX;

    // strings: evenly spaced in the usable area (exclude label margin)
    var usableH = h - labelMargin;
    var spacingY = usableH / rows;
    var stringYs = [];
    for (var s = 0; s < rows; s++) {
        var y = spacingY * s + spacingY / 2;
        stringYs.push(y);
    }
    var topY = stringYs[0];
    var bottomY = stringYs[stringYs.length - 1];

    // draw vertical nut/fret lines only between high/low strings
    for (var f = 0; f <= cols; f++) {
        var x = baseX + spacingX * f;
        ctx.beginPath();
        ctx.moveTo(x, topY);
        ctx.lineTo(x, bottomY);
        ctx.lineWidth = (f === 0 ? 3 : 1);
        ctx.stroke();
    }

    // draw strings
    ctx.lineWidth = 1;
    stringYs.forEach(function(y) {
        ctx.beginPath();
        ctx.moveTo(baseX, y);
        ctx.lineTo(w, y);
        ctx.stroke();
    });

    // fret markers (inlay dots)
    var markers = [3,5,7,9,12,15,17,19,21];
    ctx.fillStyle = '#444';
    markers.forEach(function(f) {
        if (f > cols) return;
        var mx = baseX + spacingX * (f - 0.5);
        var ry = usableH / 2;
        if (f === 12) {
            // draw two vertical dots for 12th fret
            var dy = 8;
            ctx.beginPath(); ctx.arc(mx, ry - dy, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(mx, ry + dy, 4, 0, Math.PI*2); ctx.fill();
        } else {
            var radius = 5;
            ctx.beginPath();
            ctx.arc(mx, ry, radius, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // fret numbers at actual fret lines (positioned cleanly in reserved margin)
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    for (var f = 0; f <= cols; f++) {
        var x = baseX + spacingX * f;
        ctx.fillText(f, x, h - 4);
    }
}

// draw a simple ukulele fretboard (4 strings, typical ukulele inlay markers)
function drawUkuleleFretboard(canvas, cols = 12, rows = 4,
                              cellW = null, cellH = null,
                              offsetX = 0, labelMargin = 28) {
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;

    var spacingX = cellW || ((w - offsetX) / cols);
    var baseX = offsetX;

    var usableH = h - labelMargin;
    var spacingY = usableH / rows;
    var stringYs = [];
    for (var s = 0; s < rows; s++) {
        var y = spacingY * s + spacingY / 2;
        stringYs.push(y);
    }
    var topY = stringYs[0];
    var bottomY = stringYs[stringYs.length - 1];

    for (var f = 0; f <= cols; f++) {
        var x = baseX + spacingX * f;
        ctx.beginPath();
        ctx.moveTo(x, topY);
        ctx.lineTo(x, bottomY);
        ctx.lineWidth = (f === 0 ? 3 : 1);
        ctx.stroke();
    }

    ctx.lineWidth = 1;
    stringYs.forEach(function(y) {
        ctx.beginPath();
        ctx.moveTo(baseX, y);
        ctx.lineTo(w, y);
        ctx.stroke();
    });

    // ukulele marker frets: usually 5,7,10,12 (double), 15, etc.
    var markers = [5,7,10,12,15,17,19];
    ctx.fillStyle = '#444';
    markers.forEach(function(f) {
        if (f > cols) return;
        var mx = baseX + spacingX * (f - 0.5);
        var ry = usableH / 2;
        if (f === 12) {
            var dy = 8;
            ctx.beginPath(); ctx.arc(mx, ry - dy, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(mx, ry + dy, 4, 0, Math.PI*2); ctx.fill();
        } else {
            var radius = 5;
            ctx.beginPath();
            ctx.arc(mx, ry, radius, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    for (var f = 0; f <= cols; f++) {
        var x = baseX + spacingX * f;
        ctx.fillText(f, x, h - 4);
    }
}

// helper analogous to updateGuitarCanvas but for ukulele
function updateUkuleleCanvas(divId, tableId) {
    requestAnimationFrame(function() {
        var $tbl = $("#" + tableId);
        if (!$tbl.length) {
            return;
        }
        var cols = $tbl.find('tr:first td').length;
        var rows = $tbl.find('tr').length;
        if (cols === 0 || rows === 0) {
            return;
        }
        var tblW = $tbl.outerWidth();
        var tblH = $tbl.outerHeight();
        var cellW = tblW / cols;
        var labelMargin = 28;
        var offsetX = cellW / 2;
        var w = tblW + offsetX;
        var h = tblH + labelMargin;
        var c = ensureInstrumentCanvas(divId, w, h);
        drawUkuleleFretboard(c, cols, rows, cellW, null, offsetX, labelMargin);
    });
}

function isTenHoleHarmonica(type) {
    return type !== 'guitar' && type !== 'ukulele' && type !== 'piano' && !isChromaticHarmonica(type);
}

function isChromaticHarmonica(type) {
    return type && (type.startsWith('chromatic12') || type.startsWith('chromatic16'));
}

// draw a complete 10-hole harmonica body with Blow and Draw reed plates,
// solid black outer border, central comb with hole numbers 1-10, and bend/overblow grid zones
function drawHarmonicaDiagram(canvas, cols = 10, rows = 7,
                              cellW = null, cellH = null,
                              blowRow = 2, drawRow = 3,
                              activeCells = null, cellMeta = null) {
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    var actualCellW = cellW || (w / cols);
    var actualCellH = cellH || (h / rows);

    // 1. Harmonica Core Body (Blow and Draw rows)
    var coreY = blowRow * actualCellH;
    var coreH = (drawRow - blowRow + 1) * actualCellH;

    // 2. Central Comb Mouthpiece Rail & Vertical Comb Dividers
    var combY = drawRow * actualCellH;
    ctx.fillStyle = '#000000';
    ctx.fillRect(2, combY - 4, w - 4, 8);

    // Vertical comb partitions
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.5;
    for (var c = 0; c <= cols; c++) {
        var x = (c === cols) ? (w - 3) : (c === 0 ? 2 : Math.round(c * actualCellW));
        ctx.beginPath();
        ctx.moveTo(x, coreY);
        ctx.lineTo(x, coreY + coreH);
        ctx.stroke();
    }

    // 3. Solid Black Outer Border around Blow & Draw Reed Rows (Harmonica Body)
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4.5;
    ctx.strokeRect(2, coreY, w - 4, coreH);

    // 6. Grid for Overblow, Overdraw, Valve Bends & Dual-reed Bend Zones (Outside Core Body)
    // ONLY draw background and border for cells that actually have notes!
    // Shaded lighter so the core blow and draw reed rows remain the prominent focal point.
    for (var r = 0; r < rows; r++) {
        if (r === blowRow || r === drawRow) continue;
        var y = r * actualCellH;
        var isUpper = r < blowRow;
        var depthFromCore = isUpper ? (blowRow - r) : (r - drawRow);

        for (var c = 0; c < cols; c++) {
            var hasNote = activeCells && activeCells[r] && activeCells[r][c];
            if (!hasNote) continue; // No note -> leave transparent, no border

            var x = c * actualCellW;
            var meta = (cellMeta && cellMeta[r] && cellMeta[r][c]) ? cellMeta[r][c] : null;

            var fillColor = 'rgba(255, 251, 235, 0.45)';
            var borderColor = 'rgba(100, 116, 139, 0.4)';
            var innerStroke = 'rgba(100, 116, 139, 0.2)';
            var badgeText = '';
            var badgeBg = '#475569';
            var badgeColor = '#ffffff';

            if (meta) {
                if (meta.type === 'overblow' || meta.type === 'overdraw') {
                    fillColor = 'rgba(245, 238, 255, 0.45)';
                    borderColor = 'rgba(124, 58, 237, 0.5)';
                    innerStroke = 'rgba(147, 51, 234, 0.2)';
                    badgeText = meta.type === 'overblow' ? 'OB' : 'OD';
                    badgeBg = 'rgba(124, 58, 237, 0.85)';
                } else if (meta.type === 'valve-bend') {
                    fillColor = 'rgba(236, 253, 245, 0.45)';
                    borderColor = 'rgba(5, 150, 105, 0.5)';
                    innerStroke = 'rgba(16, 185, 129, 0.2)';
                    badgeText = 'VB';
                    badgeBg = 'rgba(5, 150, 105, 0.85)';
                } else if (meta.type === 'blow-bend') {
                    fillColor = 'rgba(240, 249, 255, 0.45)';
                    borderColor = 'rgba(59, 130, 246, 0.5)';
                    innerStroke = 'rgba(59, 130, 246, 0.2)';
                    badgeText = 'BB';
                    badgeBg = 'rgba(37, 99, 235, 0.85)';
                } else if (meta.type === 'draw-bend') {
                    fillColor = (depthFromCore === 1) ? 'rgba(255, 251, 235, 0.45)' : ((depthFromCore === 2) ? 'rgba(254, 243, 199, 0.55)' : 'rgba(253, 230, 138, 0.65)');
                    borderColor = (depthFromCore === 1) ? 'rgba(180, 83, 9, 0.5)' : ((depthFromCore === 2) ? 'rgba(217, 119, 6, 0.6)' : 'rgba(185, 28, 28, 0.6)');
                    innerStroke = 'rgba(217, 119, 6, 0.2)';
                    badgeText = 'DB';
                    badgeBg = 'rgba(217, 119, 6, 0.85)';
                }
            } else {
                fillColor = isUpper ? 'rgba(240, 249, 255, 0.45)' : (depthFromCore === 1 ? 'rgba(255, 251, 235, 0.45)' : (depthFromCore === 2 ? 'rgba(254, 243, 199, 0.55)' : 'rgba(253, 230, 138, 0.65)'));
                borderColor = 'rgba(100, 116, 139, 0.4)';
                badgeText = isUpper ? 'BB' : 'DB';
                badgeBg = isUpper ? 'rgba(37, 99, 235, 0.85)' : 'rgba(217, 119, 6, 0.85)';
            }

            // Only draw colored border and corner badge (no fill color, no inner nested squares)
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x + 1, y + 1, actualCellW - 2, actualCellH - 2);

            // Small badge in corner of the cell for OB, OD, VB, BB, DB
            if (badgeText) {
                ctx.fillStyle = badgeBg;
                var bw = 18, bh = 12;
                ctx.fillRect(x + actualCellW - bw - 4, y + 4, bw, bh);
                ctx.fillStyle = badgeColor;
                ctx.font = 'bold 8px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(badgeText, x + actualCellW - bw / 2 - 4, y + 4 + bh / 2);
            }
        }
    }

    // 7. Hole Number Badges on Comb Rail (1 to 10)
    for (var c = 0; c < cols; c++) {
        var cx = c * actualCellW + actualCellW / 2;
        var cy = combY;
        var badgeW = 22;
        var badgeH = 18;

        ctx.fillStyle = '#000000';
        ctx.fillRect(cx - badgeW / 2, cy - badgeH / 2, badgeW, badgeH);

        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - badgeW / 2, cy - badgeH / 2, badgeW, badgeH);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(c + 1, cx, cy);
    }

    // 8. Row Labels (Blow, Draw, ' bend, '' bend, ''' bend in column 0)
    ctx.font = 'bold 9px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    for (var r = 0; r < rows; r++) {
        var labelY = r * actualCellH + 4;
        if (r < blowRow) {
            var diff = blowRow - r;
            var bendLabel = (diff === 2) ? "'' bend" : "' bend / OB / VB";
            ctx.fillStyle = '#475569';
            ctx.fillText(bendLabel, 5, labelY);
        } else if (r === blowRow) {
            ctx.fillStyle = '#1e40af';
            ctx.fillText('BLOW', 5, labelY);
        } else if (r === drawRow) {
            ctx.fillStyle = '#92400e';
            ctx.fillText('DRAW', 5, labelY);
        } else if (r > drawRow) {
            var diff = r - drawRow;
            var bendLabel = (diff === 1) ? "' bend / OD / VB" : ((diff === 2) ? "'' bend" : "''' bend");
            var bendColor = (diff === 1) ? '#b45309' : ((diff === 2) ? '#d97706' : '#b91c1c');
            ctx.fillStyle = bendColor;
            ctx.fillText(bendLabel, 5, labelY);
        }
    }

    // 9. Casing Accents / Corner Screws
    var drawScrew = function(sx, sy) {
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#64748b';
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.stroke();
    };
    drawScrew(6, coreY + 6);
    drawScrew(w - 6, coreY + 6);
    drawScrew(6, coreY + coreH - 6);
    drawScrew(w - 6, coreY + coreH - 6);
}

// update the canvas behind any 10-hole harmonica table
function updateHarmonicaCanvas(divId, tableId) {
    requestAnimationFrame(function() {
        var $tbl = $("#" + tableId);
        if (!$tbl.length) {
            return;
        }
        var cols = $tbl.find('tr:first td').length;
        var rows = $tbl.find('tr').length;
        if (cols === 0 || rows === 0) {
            return;
        }
        var tblW = $tbl.outerWidth();
        var tblH = $tbl.outerHeight();
        var cellW = tblW / cols;
        var cellH = tblH / rows;
        var w = tblW;
        var h = tblH;
        var c = ensureInstrumentCanvas(divId, w, h);

        // Build activeCells matrix
        var activeCells = [];
        $tbl.find('tr').each(function(rIdx, tr) {
            activeCells[rIdx] = [];
            $(tr).find('td').each(function(cIdx, td) {
                var hasNote = !!$(td).find('img').attr('name') || !!$(td).find('img').attr('tone');
                activeCells[rIdx][cIdx] = hasNote;
            });
        });

        // Determine blowRow and drawRow based on tuning rows
        var blowRow = 2, drawRow = 3;
        if (rows === 6) {
            blowRow = 1; drawRow = 2;
        } else if (rows === 4) {
            blowRow = 1; drawRow = 2;
        } else if (rows === 3) {
            blowRow = 0; drawRow = 1;
        } else if (rows === 7) {
            blowRow = 2; drawRow = 3;
        } else {
            for (var r = 0; r < rows; r++) {
                var notesInRow = 0;
                for (var col = 0; col < cols; col++) {
                    if (activeCells[r] && activeCells[r][col]) notesInRow++;
                }
                if (notesInRow === cols) {
                    blowRow = r;
                    drawRow = r + 1;
                    break;
                }
            }
        }

        var cellMeta = (typeof TuningEngine !== 'undefined' && TuningEngine.harmonicaMatrices) ? TuningEngine.harmonicaMatrices[tableId] : null;
        drawHarmonicaDiagram(c, cols, rows, cellW, cellH, blowRow, drawRow, activeCells, cellMeta);
    });
}

// Draw a complete 12- or 16-hole Chromatic Harmonica body with Slide-In / Slide-Out rows
function drawChromaticDiagram(canvas, cols = 12, rows = 4, cellW = null, cellH = null) {
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    var actualCellW = cellW || (w / cols);
    var actualCellH = cellH || (h / rows);

    var blowRow = 1;
    var drawRow = 2;

    // 1. Core Body (Blow Row 1 and Draw Row 2)
    var coreY = blowRow * actualCellH;
    var coreH = (drawRow - blowRow + 1) * actualCellH;

    // 2. Central Comb Mouthpiece Rail & Vertical Comb Dividers
    var combY = drawRow * actualCellH;
    ctx.fillStyle = '#000000';
    ctx.fillRect(2, combY - 4, w - 4, 8);

    // Vertical comb partitions
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.5;
    for (var c = 0; c <= cols; c++) {
        var x = (c === cols) ? (w - 3) : (c === 0 ? 2 : Math.round(c * actualCellW));
        ctx.beginPath();
        ctx.moveTo(x, coreY);
        ctx.lineTo(x, coreY + coreH);
        ctx.stroke();
    }

    // 3. Solid Black Outer Border around Blow & Draw Reed Rows (Harmonica Body)
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4.5;
    ctx.strokeRect(2, coreY, w - 4, coreH);

    // 6. Slide-In Rows: Row 0 (Top Slide-In Blow) and Row 3 (Bottom Slide-In Draw)
    for (var r of [0, 3]) {
        var y = r * actualCellH;
        for (var c = 0; c < cols; c++) {
            var x = c * actualCellW;

            // Only draw clean colored border and corner badge (no cell fill, no inner nested squares)
            ctx.strokeStyle = 'rgba(124, 58, 237, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x + 1, y + 1, actualCellW - 2, actualCellH - 2);

            // Small badge in corner: IN
            ctx.fillStyle = 'rgba(124, 58, 237, 0.85)';
            var bw = 18, bh = 12;
            ctx.fillRect(x + actualCellW - bw - 4, y + 4, bw, bh);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 8px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('IN', x + actualCellW - bw / 2 - 4, y + 4 + bh / 2);
        }
    }

    // 7. Hole Number Badges on Comb Rail (1 to cols)
    for (var c = 0; c < cols; c++) {
        var cx = c * actualCellW + actualCellW / 2;
        var cy = combY;
        var badgeW = 20;
        var badgeH = 16;

        ctx.fillStyle = '#000000';
        ctx.fillRect(cx - badgeW / 2, cy - badgeH / 2, badgeW, badgeH);

        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - badgeW / 2, cy - badgeH / 2, badgeW, badgeH);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(c + 1, cx, cy);
    }

    // 8. Row Labels (Left Column)
    ctx.font = 'bold 9px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    ctx.fillStyle = '#6b21a8';
    ctx.fillText('BLOW (SLIDE-IN)', 5, 0 * actualCellH + 4);

    ctx.fillStyle = '#1e40af';
    ctx.fillText('BLOW (SLIDE-OUT)', 5, 1 * actualCellH + 4);

    ctx.fillStyle = '#92400e';
    ctx.fillText('DRAW (SLIDE-OUT)', 5, 2 * actualCellH + 4);

    ctx.fillStyle = '#6b21a8';
    ctx.fillText('DRAW (SLIDE-IN)', 5, 3 * actualCellH + 4);

    // 9. Casing Corner Screws
    var drawScrew = function(sx, sy) {
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#64748b';
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.stroke();
    };
    drawScrew(6, coreY + 6);
    drawScrew(w - 6, coreY + 6);
    drawScrew(6, coreY + coreH - 6);
    drawScrew(w - 6, coreY + coreH - 6);
}

// Draw a complete 7-octave Piano Keyboard on HTML5 Canvas with realistic keys
function drawPianoDiagram(canvas, cols = 12, rows = 7, cellW = null, cellH = null) {
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var w = canvas.width || 800;
    var h = canvas.height || 400;
    ctx.clearRect(0, 0, w, h);

    var actualCellW = cellW || (w / cols);
    var actualCellH = cellH || (h / rows);

    var blackKeyCols = [1, 3, 6, 8, 10]; // C#, D#, F#, G#, A#
    var noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    // 1. Piano Outer Casing
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, w, h);

    // 2. Draw Keys row by row (Octaves 1 to 7)
    for (var r = 0; r < rows; r++) {
        var oct = r + 1;
        var y = r * actualCellH;
        var whiteTailH = Math.max(7, Math.round(actualCellH * 0.13));
        var tailY = y + actualCellH - whiteTailH - 2;

        // Top Red Felt Rail (Cushion damper strip along top of keys)
        ctx.fillStyle = '#881337';
        ctx.fillRect(0, y, w, 4);
        ctx.fillStyle = '#4c0519';
        ctx.fillRect(0, y + 3, w, 1);

        // --- PASS 1: Draw All White Key Bodies (Seamless Ivory Base) ---
        for (var c = 0; c < cols; c++) {
            if (blackKeyCols.indexOf(c) !== -1) continue;
            var x = c * actualCellW;
            var noteName = noteNames[c] + oct;
            var isMiddleC = (r === 3 && c === 0);

            // Ivory Key Body Gradient
            var whiteGrad = ctx.createLinearGradient(x, y + 4, x, y + actualCellH);
            whiteGrad.addColorStop(0, '#ffffff');
            whiteGrad.addColorStop(0.15, '#f8fafc');
            whiteGrad.addColorStop(0.85, '#f1f5f9');
            whiteGrad.addColorStop(1, '#e2e8f0');

            ctx.fillStyle = whiteGrad;
            ctx.fillRect(x, y + 4, actualCellW, actualCellH - 6);

            // Note Name Typography (Positioned lower than center)
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            var labelY = y + actualCellH * 0.68;

            if (isMiddleC) {
                // Middle C Accent
                ctx.fillStyle = '#b45309';
                ctx.font = 'bold 15px "Segoe UI", Arial, sans-serif';
                ctx.fillText('C4', x + actualCellW / 2, labelY - 4);

                ctx.font = 'bold 9px "Segoe UI", Arial, sans-serif';
                ctx.fillText('(Mid)', x + actualCellW / 2, labelY + 9);

                // Small reference pip
                ctx.beginPath();
                ctx.arc(x + actualCellW / 2, labelY - 14, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 15px "Segoe UI", Arial, sans-serif';
                ctx.fillText(noteName, x + actualCellW / 2, labelY);
            }
        }

        // --- PASS 2: Draw Black Keys & Seamless White Front Extension ---
        for (var c = 0; c < cols; c++) {
            if (blackKeyCols.indexOf(c) === -1) continue;
            var x = c * actualCellW;
            var noteName = noteNames[c] + oct;

            // 1. Recessed dark keybed slot behind black key cap
            ctx.fillStyle = '#020617';
            ctx.fillRect(x, y + 4, actualCellW, actualCellH - 4 - whiteTailH);

            // 2. White Key Extension at bottom (Seamlessly joins adjacent white keys with NO side borders)
            var whiteTailGrad = ctx.createLinearGradient(x, tailY, x, y + actualCellH);
            whiteTailGrad.addColorStop(0, '#f1f5f9');
            whiteTailGrad.addColorStop(1, '#e2e8f0');

            ctx.fillStyle = whiteTailGrad;
            ctx.fillRect(x - 0.5, tailY, actualCellW + 1, whiteTailH);

            // Vertical line dividing the adjacent white keys at the front
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(Math.round(x + actualCellW / 2), tailY);
            ctx.lineTo(Math.round(x + actualCellW / 2), y + actualCellH - 3);
            ctx.stroke();

            // 3. Raised 3D Ebony Key Cap (stops short above the white extension)
            var keyInsetX = 4;
            var keyW = actualCellW - (keyInsetX * 2);
            var keyH = actualCellH - 4 - whiteTailH - 3;
            var keyX = x + keyInsetX;
            var keyY = y + 4;

            // Tight drop shadow below black key nose (reduced to ~2px)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.fillRect(keyX + 1, keyY + keyH, keyW - 2, 2);

            // 3D Ebony Key Cap Gradient
            var blackGrad = ctx.createLinearGradient(keyX, keyY, keyX, keyY + keyH);
            blackGrad.addColorStop(0, '#475569');
            blackGrad.addColorStop(0.12, '#334155');
            blackGrad.addColorStop(0.4, '#1e293b');
            blackGrad.addColorStop(0.85, '#0f172a');
            blackGrad.addColorStop(1, '#020617');

            ctx.fillStyle = blackGrad;
            ctx.fillRect(keyX, keyY, keyW, keyH);

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.strokeRect(keyX, keyY, keyW, keyH);

            // Front edge shadow on black key nose
            ctx.fillStyle = '#020617';
            ctx.fillRect(keyX + 1, keyY + keyH - 3, keyW - 2, 3);

            // Gloss sheen along top edge
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(keyX + 2, keyY + 1);
            ctx.lineTo(keyX + keyW - 2, keyY + 1);
            ctx.stroke();

            // Note Name Typography (Positioned lower than center of black key)
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 13px "Segoe UI", Arial, sans-serif';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 3;
            ctx.fillText(noteName, keyX + keyW / 2, keyY + keyH * 0.68);
            ctx.shadowBlur = 0;
        }

        // Divider between E (col 4) and F (col 5) where there is no black key (darkened for clear separation)
        var efDividerX = Math.round(5 * actualCellW);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(efDividerX, y + 4);
        ctx.lineTo(efDividerX, y + actualCellH - 3);
        ctx.stroke();

        // 3D Bottom Lip & Highlight across all white keys in the octave
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(2, y + actualCellH - 5, w - 4, 2);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.fillRect(2, y + actualCellH - 6, w - 4, 1);

        // Octave Separator Rail
        if (r < rows - 1) {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, y + actualCellH - 2, w, 2);
            ctx.fillStyle = '#18181b';
            ctx.fillRect(0, y + actualCellH - 1, w, 1);
        }
    }

    // 3. Solid Black Outer Piano Casing Border
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, w - 4, h - 4);
}

}

function loadInstrument(bankNum) {

    var $card = $('#bank-card-' + bankNum);
    $card.removeClass('bank-card-wide bank-card-compact')
         .addClass(isWide ? 'bank-card-wide' : 'bank-card-compact');

    $("#" + tableId).html(TuningEngine.generateInstrumentHtml(type, tuning, isValved, tableId));
    attachAll(tableId);
    if (type === 'guitar') {
        updateGuitarCanvas(divId, tableId);
    } else if (type === 'ukulele') {
        updateUkuleleCanvas(divId, tableId);
    } else if (type === 'piano') {
        updatePianoCanvas(divId, tableId);
    } else if (isTenHoleHarmonica(type)) {
        updateHarmonicaCanvas(divId, tableId);
    } else if (isChromaticHarmonica(type)) {
        updateChromaticCanvas(divId, tableId);
    } else {
        $("#" + divId).html(img[type] || '');
    }
    updateBankTitleBadge(bankNum);
}

function loadInstrument1() { loadInstrument(1); }
function loadInstrument2() { loadInstrument(2); }
function loadInstrument3() { loadInstrument(3); }
function loadInstrument4() { loadInstrument(4); }

function updateAfterInstrumentChange() {
    updateNoteNames();
    if (scaleMode) {
        var scale = $("#scaleMenu").val();
        var key = $("#keyMenu").val();
        showScale(scale, key);
    }
    updateUrl();
}

function updateBankTitleBadge(bankNum) {
    var typeText = $('#instrument' + bankNum + 'Menu option:selected').text() || 'Instrument';
    var tuningText = $('#tuning' + bankNum + 'Menu option:selected').text() || '';
    var isValved = $('#valved' + bankNum).is(':checked');
    var isDiatonic = isTenHoleHarmonica($('#instrument' + bankNum + 'Menu').val());
    var str = typeText;
    if (tuningText) str += ' &mdash; ' + tuningText;
    if (isValved && isDiatonic) str += ' (Half-Valved)';
    $('#bank' + bankNum + 'Title').html(str);
}
</script>

<script type="text/javascript">
let sweep = false;
let scaleMode = false;
let showScaleDegrees = true;
let showNoteNames = true;
let pluck = true;

function attachAll(inTable) {
    var tbl = document.getElementById(inTable);
    if (!tbl) return;
    for (var p of Array.from(tbl.getElementsByTagName("img"))) {
        p.onmouseover = doMouseOver;
        p.onmouseout  = doMouseOut;
        p.onmousedown = doMouseDown;
        p.setAttribute("originalSrc", p.src);
    }
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function highlight(name, outline = true) {
    for (var p of Array.from(document.getElementsByName(name))) {
        var td = p.parentElement;
        if (outline) td.classList.add('highlight-outline');
        td.classList.add('highlight');
    }
}

function clearHighlight(name) {
    for (var p of Array.from(document.getElementsByName(name))) {
        var td = p.parentElement;
        td.classList.remove('highlight', 'highlight-outline', 'scale-degree', 'root');
        const deg = td.querySelector('.scale-degree-label');
        if (deg) deg.remove();
        if (!showNoteNames) {
            const nn = td.querySelector('.noteNameText');
            if (nn) nn.remove();
        }
    }
}

function highlightBorder(name) {
    for (var p of Array.from(document.getElementsByName(name))) {
        p.parentElement.classList.add('highlight-outline');
    }
}

function clearHighlightBorder(name) {
    for (var p of Array.from(document.getElementsByName(name))) {
        p.parentElement.classList.remove('highlight-outline');
    }
}

function highlightDegree(name, degree) {
    const degreeMap = {1:'R',2:'b2',3:'2',4:'b3',5:'3',6:'4',7:'b5',8:'5',9:'b6',10:'6',11:'b7',12:'7'};
    const isBlackKey = name && name.endsWith('s');
    for (var p of Array.from(document.getElementsByName(name))) {
        var td = p.parentElement;
        let span = td.querySelector('.scale-degree-label');
        if (!span) {
            span = document.createElement('span');
            span.className = 'scale-degree-label';
            td.appendChild(span);
        }
        span.textContent = degreeMap[degree] || degree.toString();
        if (isBlackKey) {
            span.classList.add('white-text');
            td.classList.add('black-key');
        } else {
            span.classList.remove('white-text');
            td.classList.remove('black-key');
        }
        td.classList.remove('highlight-outline', 'highlight');
        td.classList.add('scale-degree');
        if (degree == 1) td.classList.add('root');
    }
}

function highlightred(name) {
    const isBlackKey = name && name.endsWith('s');
    for (var p of Array.from(document.getElementsByName(name))) {
        var td = p.parentElement;
        td.classList.remove('highlight-outline', 'highlight');
        td.classList.add('scale-degree', 'root');
        let span = td.querySelector('.scale-degree-label');
        if (!span) {
            span = document.createElement('span');
            span.className = 'scale-degree-label';
            td.appendChild(span);
        }
        span.textContent = 'R';
        if (isBlackKey) {
            span.classList.add('white-text');
            td.classList.add('black-key');
        } else {
            span.classList.remove('white-text');
            td.classList.remove('black-key');
        }
    }
}

function doMouseOver() {
    if (!scaleMode) {
        highlight(this.name, true);
    } else {
        highlightBorder(this.name);
    }
    if (sweep) playElement(this);
}

function doMouseOut() {
    if (!scaleMode) {
        clearHighlight(this.name);
    } else {
        clearHighlightBorder(this.name);
    }
}

function showNoteName(name) {
    for (var p of Array.from(document.getElementsByName(name))) {
        if (!p.classList.contains('noNoteNames')) {
            var td = p.parentElement;
            if (!td.querySelector('.noteNameText')) {
                var span = document.createElement('span');
                span.className = 'noteNameText';
                span.textContent = noteNamesFlats[name] || name;
                td.appendChild(span);
            }
        }
    }
}

function clearNoteName(name) {
    for (var p of Array.from(document.getElementsByName(name))) {
        var td = p.parentElement;
        const node = td.querySelector('.noteNameText');
        if (node) node.remove();
    }
}

function doMouseDown() {
    if (!$(this).attr('name')) return;
    sweep = true;
    playElement(this);
}

function playElement(element) {
    if (!element) return;
    var name = $(element).attr('name');
    var toneAttr = $(element).attr('tone');
    var toneVal = toneAttr ? parseFloat(toneAttr) : NaN;
    if (isNaN(toneVal) && name && typeof TuningEngine !== 'undefined') {
        var m = TuningEngine.noteToMidi(name);
        if (m !== null) toneVal = TuningEngine.midiToFrequency(m);
    }

    if (!clickVoice && typeof initAudio === 'function') {
        initAudio();
    }
    if (audioContext && audioContext.state !== 'running') {
        audioContext.resume();
    }

    if (clickVoice && !isNaN(toneVal) && toneVal > 0) {
        clickVoice.start(toneVal, 1, pluck);
    } else if (name) {
        var audioEl = document.getElementById(name);
        if (audioEl) {
            audioEl.currentTime = 0;
            audioEl.play().catch(function() {});
        }
    }
}

function mouseUp() {
    sweep = false;
    if (clickVoice) clickVoice.stop();
}

function updateAllCanvases() {
    for (let b = 1; b <= 4; b++) {
        var type = $("#instrument" + b + "Menu").val();
        var tableId = 'instrument' + b;
        var divId = 'instrumentimg' + b;
        if (type === 'guitar') updateGuitarCanvas(divId, tableId);
        else if (type === 'ukulele') updateUkuleleCanvas(divId, tableId);
        else if (type === 'piano') updatePianoCanvas(divId, tableId);
        else if (isTenHoleHarmonica(type)) updateHarmonicaCanvas(divId, tableId);
        else if (isChromaticHarmonica(type)) updateChromaticCanvas(divId, tableId);
    }
}

function setSelectValuesFromUrl() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const selectElements = document.querySelectorAll('select');
        selectElements.forEach(select => {
            const paramValue = urlParams.get(select.id);
            if (paramValue) {
                select.value = paramValue;
                for (let b = 1; b <= 4; b++) {
                    if (select.id === "instrument" + b + "Menu") {
                        $("#tuning" + b + "Menu").html(menu[$("#instrument" + b + "Menu").val()]);
                    }
                }
            }
        });

        for (let b = 1; b <= 4; b++) {
            updateValvedVisibility(b);
            const valvedParam = urlParams.get('valved' + b);
            if (valvedParam !== null) {
                $('#valved' + b).prop('checked', valvedParam === 'true' || valvedParam === '1');
            }
        }

        for (let b = 1; b <= 4; b++) {
            loadInstrument(b);
        }
        updateAfterInstrumentChange();

        const displayScaleParam = urlParams.get('displayScale');
        if (displayScaleParam === 'true') {
            var scale = $("#scaleMenu").val();
            var key = $("#keyMenu").val();
            showScale(scale, key);
        }
    } catch(e) {
        console.error("Initialization error:", e);
    }
}

function updateUrl() {
    try {
        const newUrl = new URL(window.location.href);
        for (let b = 1; b <= 4; b++) {
            setUrlParams(document.querySelector('select[id="instrument' + b + 'Menu"]'), newUrl);
            setUrlParams(document.querySelector('select[id="tuning' + b + 'Menu"]'), newUrl);
            var type = $('#instrument' + b + 'Menu').val();
            if (isTenHoleHarmonica(type)) {
                newUrl.searchParams.set('valved' + b, $('#valved' + b).is(':checked'));
            } else {
                newUrl.searchParams.delete('valved' + b);
            }
        }
        setUrlParams(document.querySelector('select[id="scaleMenu"]'), newUrl);
        setUrlParams(document.querySelector('select[id="keyMenu"]'), newUrl);
        newUrl.searchParams.set('displayScale', scaleMode);
        history.pushState({}, '', newUrl);
    } catch(e) {}
}

function setUrlParams(ele, url) {
    if (ele && ele.id && ele.value !== undefined) {
        url.searchParams.set(ele.id, ele.value);
    }
}

$(document).ready(function() {
    // Default initial instruments for Bank 1-4 if not specified in URL
    const defaultInstruments = ['diatonicrichter', 'piano', 'guitar', 'guitar'];
    const defaultTunings = ['c', 'standard', 'standard', 'standard'];

    // Populate instrument dropdown menus with all available instruments
    for (let b = 1; b <= 4; b++) {
        $("#instrument" + b + "Menu").html(menu.allInstruments || menu["instrument" + b]);
        $("#instrument" + b + "Menu").val(defaultInstruments[b - 1]);
        $("#tuning" + b + "Menu").html(menu[$("#instrument" + b + "Menu").val()]);
        $("#tuning" + b + "Menu").val(defaultTunings[b - 1]);
        updateValvedVisibility(b);

        (function(bankNum) {
            $('#instrument' + bankNum + 'Menu').change(function() {
                $("#tuning" + bankNum + "Menu").html(menu[$("#instrument" + bankNum + "Menu").val()]);
                updateValvedVisibility(bankNum);
                loadInstrument(bankNum);
                updateAfterInstrumentChange();
            });
            $('#tuning' + bankNum + 'Menu').change(function() {
                loadInstrument(bankNum);
                updateAfterInstrumentChange();
            });
            $('#valved' + bankNum).change(function() {
                loadInstrument(bankNum);
                updateAfterInstrumentChange();
            });
            $('#go' + bankNum).click(function() {
                loadInstrument(bankNum);
                updateAfterInstrumentChange();
            });
        })(b);
    }

    $(document).on('mouseup', mouseUp);
    $(window).on('resize', updateAllCanvases);

    // Global scale controls
    $('#displayScale').click(function() {
        var scale = $("#scaleMenu").val();
        var key = $("#keyMenu").val();
        showScale(scale, key);
        updateUrl();
    });

    $('#clearScale').click(function() {
        clearScale();
        updateUrl();
    });

    $('#scaleMenu, #keyMenu').change(function() {
        if (scaleMode) {
            var scale = $("#scaleMenu").val();
            var key = $("#keyMenu").val();
            showScale(scale, key);
            updateUrl();
        }
    });

    $('#scaleDegrees').click(function() {
        showScaleDegrees = !showScaleDegrees;
        $(this).text(showScaleDegrees ? 'Hide Scale Degrees' : 'Show Scale Degrees');
        $(this).toggleClass('active', showScaleDegrees);
        if (scaleMode) {
            var scale = $("#scaleMenu").val();
            var key = $("#keyMenu").val();
            showScale(scale, key);
        }
    });

    $('#noteNames').click(function() {
        toggleNoteNames();
        $(this).toggleClass('active', showNoteNames);
    });

    $('#audioVoiceToggle').click(function() {
        pluck = !pluck;
        $(this).text(pluck ? 'Sound: Pluck' : 'Sound: Synth');
    });

    setSelectValuesFromUrl();
});
</script>
